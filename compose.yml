name: models
services:
  dsv41-flash-exl3:
    image: ds4-flash-rs:local
    init: true
    restart: always
    stop_grace_period: 4m
    build: .
    container_name: dsv41-flash-exl3
    labels:
      io.dsv41.engine: rust-cuda
    user: "${DS4_RUN_UID:-1000}:${DS4_RUN_GID:-1000}"
    network_mode: host
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set the LiteLLM master key}
      DS4_MAX_SEQS: ${DS4_MAX_SEQS:-6}
      DS4_MAX_LIVE_SEQS: ${DS4_MAX_LIVE_SEQS:-32}
      DS4_SWAP_QUANTUM_STEPS: ${DS4_SWAP_QUANTUM_STEPS:-32}
      DS4_SWAP_RAM_MIB: ${DS4_SWAP_RAM_MIB:-49152}
      DS4_SWAP_DISK_MIB: ${DS4_SWAP_DISK_MIB:-131072}
      DS4_SWAP_DIR: /prefix/live
      DS4_TIMING_RESTORES: ${DS4_TIMING_RESTORES:-0}
      DS4_DRAFTER: ${DS4_DRAFTER:-code}
      DS4_BATCH_DRAFT: ${DS4_BATCH_DRAFT:-1}
      DS4_SPEC_K:
      DS4_EXPERT_EVICTION: ${DS4_EXPERT_EVICTION:-lfu}
      DS4_CONFIDENCE_THRESHOLD: ${DS4_CONFIDENCE_THRESHOLD:-0.4}
      DS4_CONFIDENCE_BATCH_DELTA: ${DS4_CONFIDENCE_BATCH_DELTA:-0.1}
      DS4_ADAPTIVE_DRAFT_BUDGET: ${DS4_ADAPTIVE_DRAFT_BUDGET:-0}
      DS4_ADAPTIVE_DRAFT_BUDGET_TRACE: ${DS4_ADAPTIVE_DRAFT_BUDGET_TRACE:-0}
      DS4_PROMPT_LOOKUP: ${DS4_PROMPT_LOOKUP:-1}
      DS4_OUTPUT_LOOKUP: ${DS4_OUTPUT_LOOKUP:-repeated}
      DS4_ADAPTIVE_LOOKUP: ${DS4_ADAPTIVE_LOOKUP:-1}
      DS4_LOOKUP_K: ${DS4_LOOKUP_K:-128}
      DS4_OVERLAP_PREFILL_ENGRAM: ${DS4_OVERLAP_PREFILL_ENGRAM:-0}
      DS4_VERIFY_MX_TILES: ${DS4_VERIFY_MX_TILES:-4}
      DS4_PREFILL_DECODER_PRUNE: ${DS4_PREFILL_DECODER_PRUNE:-1}
      DS4_RECIPE_PREFILL: ${DS4_RECIPE_PREFILL:-0}
      DS4_PREFILL_MX_TILES: ${DS4_PREFILL_MX_TILES:-4}
      DS4_PARALLEL_PREFILL_ROUTER: ${DS4_PARALLEL_PREFILL_ROUTER:-1}
      DS4_PACKED_DENSE: ${DS4_PACKED_DENSE:-1}
      DS4_FAST_RMS: ${DS4_FAST_RMS:-1}
      DS4_FAST_ATTN: ${DS4_FAST_ATTN:-1}
      DS4_TP2_INDEX: ${DS4_TP2_INDEX:-1}
      DS4_PREFILL_SAMPLED_TOPK: ${DS4_PREFILL_SAMPLED_TOPK:-0}
      DS4_GPU_INDEX: ${DS4_GPU_INDEX:-1}
      DS4_PREFILL_BATCHED_MQA: ${DS4_PREFILL_BATCHED_MQA:-0}
      DS4_PACKED_INDEX: ${DS4_PACKED_INDEX:-1}
      DS4_FLASHINFER_PREFILL: "${DS4_FLASHINFER_PREFILL:-1}"
      DS4_GPU_COMPRESS: ${DS4_GPU_COMPRESS:-1}
      DS4_PREFILL_GPU_POOL_PAIRS: ${DS4_PREFILL_GPU_POOL_PAIRS:-1}
      DS4_EXPERT_PARALLEL: ${DS4_EXPERT_PARALLEL:-1}
      DS4_EXPERT_STAGED: ${DS4_EXPERT_STAGED:-1}
      DS4_EXPERT_PARALLEL_DRAFT: ${DS4_EXPERT_PARALLEL_DRAFT:-0}
      DS4_MOE_PACKED_DECODE: ${DS4_MOE_PACKED_DECODE:-1}
      DS4_MOE_FUSED: ${DS4_MOE_FUSED:-1}
      DS4_MOE_CUDA_GRAPH: ${DS4_MOE_CUDA_GRAPH:-0}
      DS4_MOE_CUDA_GRAPH_TRACE: ${DS4_MOE_CUDA_GRAPH_TRACE:-0}
      DS4_MOE_CACHE_GIB: ${DS4_MOE_CACHE_GIB:-68}
      DS4_PREFIX_RAM_MIB: ${DS4_PREFIX_RAM_MIB:-6144}
      DS4_PREFIX_DISK_MIB: ${DS4_PREFIX_DISK_MIB:-65536}
      DS4_PREFIX_DIR: /prefix
      DS4_TP_DENSE: ${DS4_TP_DENSE:-1}
      DS4_TP2_PREFILL: ${DS4_TP2_PREFILL:-1}
      DS4_PREFILL_LT: ${DS4_PREFILL_LT:-1}
      DS4_PREFILL_BOUNDED_REPLAY: ${DS4_PREFILL_BOUNDED_REPLAY:-1}
      DS4_PREFILL_INDEX_MMA: ${DS4_PREFILL_INDEX_MMA:-1}
      DS4_TP2_PACKED_INPUT: ${DS4_TP2_PACKED_INPUT:-1}
      DS4_TP2_PEER_BOUNDARY: ${DS4_TP2_PEER_BOUNDARY:-0}
      DS4_TP2_PEER_DMA: ${DS4_TP2_PEER_DMA:-1}
      DS4_TP2_PRELOAD_LAYERS: ${DS4_TP2_PRELOAD_LAYERS:-0}
      DS4_TP2_STAGE_WEIGHTS: ${DS4_TP2_STAGE_WEIGHTS:-1}
      DS4_PREFILL_BLAS: ${DS4_PREFILL_BLAS:-1}
      DS4_TRANSIENT_POOL_MIB: ${DS4_TRANSIENT_POOL_MIB:-4096}
      DS4_TP_DENSE_BF16_WIRE: ${DS4_TP_DENSE_BF16_WIRE:-1}
      DS4_PREFILL_INDEX_FP8: ${DS4_PREFILL_INDEX_FP8:-1}
      DS4_PREFILL_ROUTER_BOUNDS: ${DS4_PREFILL_ROUTER_BOUNDS:-0}
      DS4_ENGRAM_RANDOM_READ: ${DS4_ENGRAM_RANDOM_READ:-0}
      DS4_BATCH_TOPK: ${DS4_BATCH_TOPK:-1}
      DS4_BATCH_DRAFT_BUDGET_PER_REQUEST: ${DS4_BATCH_DRAFT_BUDGET_PER_REQUEST:-}
      DS4_C1_OUTPUT_CONSENSUS: ${DS4_C1_OUTPUT_CONSENSUS:-1}
      DS4_EXTEND_REPETITION: ${DS4_EXTEND_REPETITION:-1}
      DS4_HEAD_ROW_TILES: ${DS4_HEAD_ROW_TILES:-1}
      DS4_AGENT_TEXT_CACHE: ${DS4_AGENT_TEXT_CACHE:-1}
      DS4_IDLE_TOOL_PREFILL_MAX_TOKENS: ${DS4_IDLE_TOOL_PREFILL_MAX_TOKENS:-32768}
      RAYON_NUM_THREADS: "12"
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      CUDA_VISIBLE_DEVICES: "0,1"
      LD_LIBRARY_PATH: /usr/local/cuda/lib64
    volumes:
      - type: bind
        source: ${DS4_HOST_PREFIX_DIR:-${HOME}/.cache/ds4-flash-rs/prefix}
        target: /prefix
        bind:
          create_host_path: false
      - /usr/local/cuda:/usr/local/cuda:ro
      - /mnt/models/dsv41-flash-exl3:/mnt/models/dsv41-flash-exl3:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1", "2"]
              capabilities: [gpu]
    command: ["serve", "--host", "0.0.0.0", "--port", "8001", "--served-model-name", "DeepSeek V4.1 Flash", "--max-context", "524288", "--chunk-size", "8192"]
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/8001; echo -en 'GET /health HTTP/1.0\r\n\r\n' >&3; read -r line <&3; [[ $$line == *' 200 '* ]]"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 3
