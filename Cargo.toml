[package]
name = "ds4-flash-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
axum = "0.8"
tokio = {version="1",features=["rt-multi-thread","net","sync","time","signal","macros"]}
tokio-stream = "0.1"
serde = { version="1", features=["derive"] }
serde_json = { version="1", features=["preserve_order"] }
memmap2 = "0.9"
half = "2"
tokenizers = "0.22"
rayon = "1"
rand = "0.8"
clap = { version = "4.6.10", features = ["derive"] }

[profile.release]
debug = 1
